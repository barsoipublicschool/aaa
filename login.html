<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCloud Studio - Educational Resources</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .card-dark {
      background-color: #0f172a;
      border: 1px solid #1e293b;
    }
    .card-dark:hover {
      border-color: #334155;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header / Navbar -->
  <header class="border-b border-slate-800 bg-[#0d1322]/80 backdrop-blur-md sticky top-0 z-50 px-4 lg:px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/20">
        📚
      </div>
      <div>
        <h1 class="font-bold text-lg text-white leading-tight">EduCloud Studio</h1>
        <p class="text-[11px] text-slate-400">Digital Resource Portal</p>
      </div>
    </div>

    <!-- Login/Logout Toggle Button -->
    <div id="auth-btn-container">
      <button onclick="showLoginModal()" id="nav-login-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
        <i class="fa-solid fa-lock"></i> <span>Teacher Login</span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 space-y-6">

    <!-- Search & Filters -->
    <div class="card-dark p-4 sm:p-6 rounded-2xl space-y-4">
      <div class="flex flex-col sm:flex-row gap-3">
        <!-- Search Input -->
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
          <input type="text" id="search-input" oninput="filterData()" placeholder="Search title, topic, subject..." class="w-full bg-[#080c14] border border-slate-800 rounded-xl pl-11 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
        </div>

        <!-- Filter Class/Category -->
        <select id="filter-class" onchange="filterData()" class="bg-[#080c14] border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-indigo-500 transition">
          <option value="ALL">All Classes</option>
        </select>

        <!-- Filter Subject -->
        <select id="filter-subject" onchange="filterData()" class="bg-[#080c14] border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-slate-300 focus:outline-none focus:border-indigo-500 transition">
          <option value="ALL">All Subjects</option>
        </select>
      </div>
    </div>

    <!-- Content Grid Section -->
    <div>
      <!-- Loader -->
      <div id="loader" class="py-20 text-center space-y-3">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-500"></i>
        <p class="text-sm text-slate-400">Loading resources from Google Sheet...</p>
      </div>

      <!-- Resource Grid -->
      <div id="resource-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 hidden"></div>

      <!-- No Results Message -->
      <div id="no-data" class="py-16 text-center space-y-2 hidden">
        <div class="text-4xl">🔍</div>
        <h3 class="text-slate-300 font-semibold">No Resources Found</h3>
        <p class="text-xs text-slate-500">Try adjusting your search query or filter selections.</p>
      </div>
    </div>
  </main>

  <!-- Login Modal -->
  <div id="login-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="card-dark w-full max-w-md rounded-2xl p-6 sm:p-8 space-y-6 relative shadow-2xl">
      <button onclick="hideLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">
        <i class="fa-solid fa-xmark"></i>
      </button>

      <div class="text-center space-y-1">
        <div class="w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 flex items-center justify-center text-xl mx-auto mb-3">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <h2 class="text-xl font-bold text-white">Teacher Login</h2>
        <p class="text-xs text-slate-400">Enter credentials to access admin panel</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">User ID</label>
          <input type="text" id="userid" required placeholder="Enter User ID" class="w-full bg-[#080c14] border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
          <input type="password" id="password" required placeholder="Enter Password" class="w-full bg-[#080c14] border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>

        <div id="login-error" class="text-xs text-red-400 bg-red-500/10 border border-red-500/20 p-2.5 rounded-xl hidden text-center"></div>

        <button type="submit" id="login-btn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl text-sm transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
          <span>Login</span> <i class="fa-solid fa-right-to-bracket"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- JavaScript Integration -->
  <script>
    // Merged Web App URL
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwS0fTCOs2KAHecJXcOYuhII0u7XlgkzwsJZ_xYXm2UwE5CU6TAW5zjeKD6qMYVagmx/exec";

    let rawData = [];

    document.addEventListener("DOMContentLoaded", () => {
      checkAuthStatus();
      fetchResources();
    });

    // Check Login Status from localStorage
    function checkAuthStatus() {
      const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
      const authContainer = document.getElementById("auth-btn-container");

      if (isLoggedIn) {
        authContainer.innerHTML = `
          <div class="flex items-center gap-2">
            <a href="update.html" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-lg shadow-emerald-600/20">
              <i class="fa-solid fa-plus"></i> <span>Add Resource</span>
            </a>
            <button onclick="handleLogout()" class="p-2 text-slate-400 hover:text-red-400 rounded-xl hover:bg-slate-800 transition" title="Logout">
              <i class="fa-solid fa-right-from-bracket"></i>
            </button>
          </div>
        `;
      } else {
        authContainer.innerHTML = `
          <button onclick="showLoginModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-semibold transition flex items-center gap-2 shadow-lg shadow-indigo-600/20">
            <i class="fa-solid fa-lock"></i> <span>Teacher Login</span>
          </button>
        `;
      }
    }

    // Fetch Resources Data from Google Apps Script
    async function fetchResources() {
      const loader = document.getElementById("loader");
      const grid = document.getElementById("resource-grid");
      const noData = document.getElementById("no-data");

      try {
        const response = await fetch(WEB_APP_URL);
        rawData = await response.json();

        loader.classList.add("hidden");

        if (!Array.isArray(rawData) || rawData.length === 0) {
          noData.classList.remove("hidden");
          return;
        }

        populateFilters(rawData);
        renderData(rawData);
        grid.classList.remove("hidden");

      } catch (err) {
        console.error("Fetch Error:", err);
        loader.innerHTML = `
          <p class="text-red-400 text-sm font-medium">⚠️ Failed to load resources.</p>
          <p class="text-slate-500 text-xs">Please check your internet connection or Apps Script Deployment.</p>
        `;
      }
    }

    // Dynamic Filter Dropdowns Setup
    function populateFilters(data) {
      const classSelect = document.getElementById("filter-class");
      const subjectSelect = document.getElementById("filter-subject");

      const classes = [...new Set(data.map(item => item[0]).filter(Boolean))];
      const subjects = [...new Set(data.map(item => item[1]).filter(Boolean))];

      classes.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        classSelect.appendChild(opt);
      });

      subjects.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        subjectSelect.appendChild(opt);
      });
    }

    // Render Cards in Grid
    function renderData(data) {
      const grid = document.getElementById("resource-grid");
      const noData = document.getElementById("no-data");

      grid.innerHTML = "";

      if (data.length === 0) {
        grid.classList.add("hidden");
        noData.classList.remove("hidden");
        return;
      }

      noData.classList.add("hidden");
      grid.classList.remove("hidden");

      data.forEach(item => {
        // Expected Row Format: [Class, Subject, Title, Type, Link]
        const itemClass = item[0] || "General";
        const subject   = item[1] || "General";
        const title     = item[2] || "Untitled Resource";
        const type      = item[3] || "PDF";
        const link      = item[4] || "#";

        // Dynamic Icon & Style by Type
        let icon = "fa-file-pdf";
        let badgeBg = "bg-red-500/10 text-red-400 border-red-500/20";

        if (type.toLowerCase().includes("video")) {
          icon = "fa-circle-play";
          badgeBg = "bg-blue-500/10 text-blue-400 border-blue-500/20";
        } else if (type.toLowerCase().includes("assignment")) {
          icon = "fa-pen-to-square";
          badgeBg = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
        }

        const card = document.createElement("div");
        card.className = "card-dark p-5 rounded-2xl flex flex-col justify-between gap-4 transition duration-200 hover:-translate-y-1 shadow-lg";

        card.innerHTML = `
          <div class="space-y-3">
            <div class="flex items-center justify-between gap-2">
              <span class="text-[11px] font-semibold uppercase px-2.5 py-1 rounded-lg border ${badgeBg}">
                <i class="fa-solid ${icon} mr-1"></i> ${type}
              </span>
              <span class="text-xs text-slate-400 bg-slate-800/60 px-2.5 py-1 rounded-lg">
                ${itemClass}
              </span>
            </div>

            <div>
              <p class="text-xs font-semibold text-indigo-400 mb-0.5">${subject}</p>
              <h3 class="text-base font-bold text-white line-clamp-2 leading-snug">${title}</h3>
            </div>
          </div>

          <a href="${link}" target="_blank" rel="noopener noreferrer" class="w-full py-2.5 bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white rounded-xl text-xs font-semibold transition flex items-center justify-center gap-2">
            <span>View Resource</span>
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
          </a>
        `;

        grid.appendChild(card);
      });
    }

    // Filter Logic
    function filterData() {
      const search = document.getElementById("search-input").value.toLowerCase();
      const selectedClass = document.getElementById("filter-class").value;
      const selectedSubject = document.getElementById("filter-subject").value;

      const filtered = rawData.filter(item => {
        const itemClass = String(item[0] || "");
        const subject   = String(item[1] || "");
        const title     = String(item[2] || "");

        const matchesSearch = title.toLowerCase().includes(search) || 
                              subject.toLowerCase().includes(search) || 
                              itemClass.toLowerCase().includes(search);

        const matchesClass = selectedClass === "ALL" || itemClass === selectedClass;
        const matchesSubject = selectedSubject === "ALL" || subject === selectedSubject;

        return matchesSearch && matchesClass && matchesSubject;
      });

      renderData(filtered);
    }

    // Login Modal Helpers
    function showLoginModal() {
      document.getElementById("login-modal").classList.remove("hidden");
    }

    function hideLoginModal() {
      document.getElementById("login-modal").classList.add("hidden");
      document.getElementById("login-error").classList.add("hidden");
    }

    // Login Authentication (GET request action=login)
    async function handleLogin(e) {
      e.preventDefault();
      const userid = document.getElementById("userid").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorDiv = document.getElementById("login-error");
      const loginBtn = document.getElementById("login-btn");

      errorDiv.classList.add("hidden");
      loginBtn.disabled = true;
      loginBtn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Checking...`;

      try {
        const url = `${WEB_APP_URL}?action=login&userid=${encodeURIComponent(userid)}&password=${encodeURIComponent(password)}`;
        const response = await fetch(url);
        const res = await response.json();

        if (res.status === "success") {
          localStorage.setItem("isLoggedIn", "true");
          hideLoginModal();
          checkAuthStatus();
        } else {
          errorDiv.innerText = res.message || "Invalid Credentials!";
          errorDiv.classList.remove("hidden");
        }
      } catch (err) {
        errorDiv.innerText = "Verification failed. Please try again.";
        errorDiv.classList.remove("hidden");
      } finally {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<span>Login</span> <i class="fa-solid fa-right-to-bracket"></i>`;
      }
    }

    // Logout Helper
    function handleLogout() {
      if (confirm("Kya aap logout karna chahte hain?")) {
        localStorage.removeItem("isLoggedIn");
        checkAuthStatus();
      }
    }
  </script>
</body>
</html>
