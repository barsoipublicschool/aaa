<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Drive Folders - Barsoi Public School</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card-dark {
      background-color: #0f172a;
      border: 1px solid #1e293b;
    }
    .card-glow {
      background: #0f172a;
      border: 1px solid #1e293b;
      transition: all 0.2s ease-in-out;
    }
    .card-glow:hover {
      border-color: #3b82f6;
    }
  </style>
</head>
<body class="p-4 md:p-6 max-w-4xl mx-auto space-y-6">

  <!-- Header with Back Button -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-11 h-11 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-white hover:bg-slate-700 transition">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <div>
        <h1 class="text-2xl font-bold text-white tracking-wide">Google Drive Folders</h1>
        <p class="text-xs text-slate-400">Barsoi Public School • Sub-folders & Resources</p>
      </div>
    </div>
  </div>

  <!-- Main Drive Folder Link Card -->
  <a href="https://drive.google.com/drive/folders/0B6bIm9hct1oFTkRxd2prWUpwOEU?resourcekey=0-rPEKQ0KpKt5bcc0NVKkt5A" target="_blank" class="block group">
    <div class="card-dark rounded-2xl p-5 border border-amber-500/40 bg-amber-500/5 flex items-center justify-between hover:border-amber-400 transition cursor-pointer">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-2xl">
          📂
        </div>
        <div>
          <h3 class="font-bold text-white text-base group-hover:text-amber-400 transition">Main Google Drive Folder</h3>
          <p class="text-xs text-slate-400 mt-0.5">Open main shared folder in Google Drive</p>
        </div>
      </div>
      <span class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold rounded-xl transition flex items-center gap-2">
        Open <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
      </span>
    </div>
  </a>

  <!-- Sub-Folders Grid (Yahan aap apne sub-folders ke links add kar sakte hain) -->
  <h2 class="text-lg font-bold text-white pt-2">Sub-Folders List</h2>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    
    <!-- Sub-Folder Card Example 1 -->
    <a href="https://drive.google.com/drive/folders/0B6bIm9hct1oFRkstR2hxMUR5SE0?resourcekey=0-k2-X2gtedIBmOfYwIY1D7Q" target="_blank" class="card-glow rounded-2xl p-5 border border-slate-800 flex items-center justify-between transition cursor-pointer">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-2xl">
          📁
        </div>
        <div>
          <h3 class="font-bold text-white text-base">Class 10th Notes</h3>
          <p class="text-xs text-slate-400 mt-0.5">Sub-folder contents</p>
        </div>
      </div>
      <span class="text-xs text-blue-400 font-semibold flex items-center gap-1">
        Explore <i class="fa-solid fa-arrow-right"></i>
      </span>
    </a>

    <!-- Sub-Folder Card Example 2 -->
    <a href="https://drive.google.com/drive/folders/0B6bIm9hct1oFM1lPN1pmUFZuVUE?resourcekey=0-R5FSXKXTSZ0GtrUCA8djuA" target="_blank" class="card-glow rounded-2xl p-5 border border-slate-800 flex items-center justify-between transition cursor-pointer">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-purple-500/10 text-purple-400 border border-purple-500/20 flex items-center justify-center text-2xl">
          📁
        </div>
        <div>
          <h3 class="font-bold text-white text-base">Science Assignments</h3>
          <p class="text-xs text-slate-400 mt-0.5">Sub-folder contents</p>
        </div>
      </div>
      <span class="text-xs text-blue-400 font-semibold flex items-center gap-1">
        Explore <i class="fa-solid fa-arrow-right"></i>
      </span>
    </a>

  </div>

</body>
</html>
