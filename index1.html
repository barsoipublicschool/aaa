<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library - Barsoi Public School</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #080c14;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card-glow {
      background: #0f172a;
      border: 1px solid #1e293b;
      transition: all 0.2s ease-in-out;
    }
    .card-glow:hover {
      border-color: #3b82f6;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="p-4 md:p-6 max-w-4xl mx-auto space-y-6">

  <!-- Header & Back Button -->
  <div class="flex items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <a href="index.html" class="w-11 h-11 rounded-2xl bg-slate-800 border border-slate-700 flex items-center justify-center text-white hover:bg-slate-700 transition">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide" id="page-title">Digital Library</h1>
        <p class="text-xs text-slate-400" id="page-subtitle">Select your class to explore books</p>
      </div>
    </div>

    <!-- Search Box -->
    <div class="relative w-48 md:w-64" id="search-box-container" style="display: none;">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input 
        type="text" 
        id="fileSearch" 
        oninput="filterFiles()"
        placeholder="Search chapters..." 
        class="w-full bg-[#0d1322] border border-blue-900/60 rounded-xl pl-9 pr-3 py-2 text-xs text-white focus:outline-none focus:border-blue-500 transition"
      />
    </div>
  </div>

  <!-- Breadcrumb Navigation -->
  <div id="breadcrumb" class="text-xs text-slate-400 flex items-center gap-2">
    <span class="text-blue-400 cursor-pointer hover:underline" onclick="goToClasses()">Library</span>
    <span id="breadcrumb-sub"></span>
  </div>

  <!-- Main Grid Container -->
  <div id="main-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="text-slate-400 text-sm col-span-2 text-center py-12">
      <i class="fa-solid fa-spinner fa-spin mr-2 text-lg"></i> Loading library books from Google Drive...
    </div>
  </div>

  <!-- JavaScript Library Logic -->
  <script>
    let libraryData = {}; // Structure: { ClassName: { SubjectName: [ {title, link, type} ] } }
    let selectedClass = null;
    let selectedSubject = null;

    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzkmcpN0ZHbDp0nFRRoUuxI9KOD8c4UqIs_ej9RydRvG4nD0IDkb7l3dNCk33uQAsZN/exec";

    async function fetchLibraryData() {
      try {
        const response = await fetch(WEB_APP_URL);
        const rows = await response.json();
        
        libraryData = {};

        rows.forEach(row => {
          let className = row[0] ? String(row[0]).trim() : "General";
          let subject = row[1] ? String(row[1]).trim() : "Uncategorized";
          let title = row[2] ? String(row[2]).trim() : "Untitled";
          let type = row[3] ? String(row[3]).trim() : "pdf";
          let link = row[4] ? String(row[4]).trim() : "#";

          // Clean up class name formatting
          if (!className.toLowerCase().includes("class")) {
            className = "Class " + className;
          }

          if (!libraryData[className]) {
            libraryData[className] = {};
          }
          if (!libraryData[className][subject]) {
            libraryData[className][subject] = [];
          }

          libraryData[className][subject].push({ title, type, link });
        });

        goToClasses();
      } catch (error) {
        console.error("Error:", error);
        document.getElementById('main-container').innerHTML = `<div class="text-red-400 text-sm col-span-2 text-center py-10">Library data load karne me error aayi.</div>`;
      }
    }

    // Step 1: View All Classes
    function goToClasses() {
      selectedClass = null;
      selectedSubject = null;
      document.getElementById('page-title').innerText = "Digital Library";
      document.getElementById('page-subtitle').innerText = "Select your class to explore books";
      document.getElementById('breadcrumb-sub').innerHTML = '';
      document.getElementById('search-box-container').style.display = 'none';

      const container = document.getElementById('main-container');
      container.innerHTML = '';

      const classes = Object.keys(libraryData);
      if (classes.length === 0) {
        container.innerHTML = `<div class="text-slate-400 text-sm col-span-2 text-center py-10">Koi class data available nahi hai.</div>`;
        return;
      }

      classes.forEach(className => {
        let totalBooks = Object.keys(libraryData[className]).length;
        let card = document.createElement('div');
        card.className = "card-glow rounded-2xl p-5 flex items-center justify-between cursor-pointer group";
        card.onclick = () => selectClass(className);

        card.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center text-2xl group-hover:scale-105 transition">
              🎓
            </div>
            <div>
              <h3 class="font-bold text-white text-base group-hover:text-blue-400 transition">${className}</h3>
              <p class="text-xs text-slate-400 mt-0.5">${totalBooks} Subjects / Books Available</p>
            </div>
          </div>
          <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Step 2: View Subjects/Books inside a Class
    function selectClass(className) {
      selectedClass = className;
      selectedSubject = null;

      document.getElementById('page-title').innerText = className;
      document.getElementById('page-subtitle').innerText = "Select a subject book";
      document.getElementById('breadcrumb-sub').innerHTML = ` <i class="fa-solid fa-chevron-right text-[10px] mx-1"></i> <span class="text-white cursor-pointer hover:underline" onclick="selectClass('${className}')">${className}</span>`;
      document.getElementById('search-box-container').style.display = 'none';

      const container = document.getElementById('main-container');
      container.innerHTML = '';

      const subjects = Object.keys(libraryData[className]);

      subjects.forEach(subject => {
        let fileCount = libraryData[className][subject].length;
        let card = document.createElement('div');
        card.className = "card-glow rounded-2xl p-5 flex items-center justify-between cursor-pointer group";
        card.onclick = () => selectSubject(subject);

        card.innerHTML = `
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center text-2xl group-hover:scale-105 transition">
              📚
            </div>
            <div>
              <h3 class="font-bold text-white text-base group-hover:text-purple-400 transition">${subject}</h3>
              <p class="text-xs text-slate-400 mt-0.5">${fileCount} Chapters / PDFs</p>
            </div>
          </div>
          <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-purple-600 group-hover:text-white transition">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Step 3: View PDFs inside a Subject Book
    function selectSubject(subject) {
      selectedSubject = subject;

      document.getElementById('page-title').innerText = subject;
      document.getElementById('page-subtitle').innerText = `Chapters & PDFs for ${selectedClass}`;
      document.getElementById('breadcrumb-sub').innerHTML = ` 
        <i class="fa-solid fa-chevron-right text-[10px] mx-1"></i> <span class="text-slate-400 cursor-pointer hover:underline" onclick="selectClass('${selectedClass}')">${selectedClass}</span>
        <i class="fa-solid fa-chevron-right text-[10px] mx-1"></i> <span class="text-white">${subject}</span>
      `;
      document.getElementById('search-box-container').style.display = 'block';
      document.getElementById('fileSearch').value = '';

      renderFiles(libraryData[selectedClass][subject]);
    }

    function renderFiles(files) {
      const container = document.getElementById('main-container');
      container.innerHTML = '';

      if (!files || files.length === 0) {
        container.innerHTML = `<div class="text-slate-400 text-sm col-span-2 text-center py-10">Is book me koi file nahi hai.</div>`;
        return;
      }

      files.forEach(file => {
        const card = document.createElement('div');
        card.className = "card-glow rounded-2xl p-5 flex flex-col justify-between space-y-4";

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between text-xs font-semibold mb-3">
              <span class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-file-pdf"></i> PDF Book
              </span>
              <span class="text-slate-400 text-xs">Ready to Read</span>
            </div>
            <h3 class="text-base font-bold text-white leading-snug">
              ${file.title}
            </h3>
          </div>
          <div class="flex items-center justify-end pt-3 border-t border-slate-800/60">
            <a href="${file.link}" target="_blank" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">
              <i class="fa-solid fa-book-open"></i> Open PDF
            </a>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterFiles() {
      if (!selectedClass || !selectedSubject) return;
      const query = document.getElementById('fileSearch').value.toLowerCase();
      const allFiles = libraryData[selectedClass][selectedSubject];
      const filtered = allFiles.filter(f => f.title.toLowerCase().includes(query));
      renderFiles(filtered);
    }

    fetchLibraryData();
  </script>
</body>
</html>
