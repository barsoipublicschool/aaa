<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCERT Digital Library</title>
    <!-- Tailwind CSS for UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-indigo-700 text-white shadow-md p-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">📚</span>
            <div>
                <h1 class="text-xl font-bold">NCERT Digital Library</h1>
                <p class="text-xs text-indigo-200">Online PDF Reader - Fast & Secure</p>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="container mx-auto max-w-5xl p-4 flex-1">

        <!-- Selection Filter Panel -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6 border border-indigo-100">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Select Your Book Details:</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Class Selection Dropdown -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Class:</label>
                    <select id="class-select" onchange="onClassChange()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                        <option value="">-- Choose Class --</option>
                    </select>
                </div>

                <!-- Subject Selection Dropdown -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Subject:</label>
                    <select id="subject-select" onchange="onSubjectChange()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500" disabled>
                        <option value="">-- Choose Subject --</option>
                    </select>
                </div>

                <!-- Book Title Dropdown -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Book Title:</label>
                    <select id="book-select" onchange="loadChapters()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500" disabled>
                        <option value="">-- Choose Book Title --</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Data Sync Spinner -->
        <div id="data-loader" class="text-center py-8 text-indigo-700 font-semibold flex items-center justify-center gap-2">
            <span class="animate-spin text-2xl">⏳</span> Library sync ho rahi hai... Kripya intzar karein...
        </div>

        <!-- Chapters List Display Card -->
        <div id="chapters-card" class="bg-white p-6 rounded-lg shadow-md hidden border border-slate-200">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 id="book-title-heading" class="text-xl font-bold text-indigo-900">Available Chapters</h3>
            </div>
            <div id="chapters-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

    </main>

    <!-- Same-Tab PDF Reader Modal View -->
    <div id="pdf-modal" class="fixed inset-0 bg-slate-950/90 hidden z-50 flex flex-col justify-between p-2 md:p-4">
        <div class="flex justify-between items-center text-white pb-2 px-2">
            <span id="modal-chapter-title" class="font-bold text-base md:text-lg">Reading Mode</span>
            <button onclick="closePdfModal()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-1.5 rounded-lg transition text-sm">✕ Close Book</button>
        </div>
        
        <!-- Embedded Google Drive Reader Frame -->
        <div class="w-full h-[85vh] bg-white rounded-lg overflow-hidden shadow-2xl relative">
            <iframe id="pdf-frame" src="" class="w-full h-full border-0"></iframe>
        </div>

        <div class="text-center text-slate-400 text-xs pt-1">
            Zoom-In / Zoom-Out aur Fullscreen ke liye reader ke top-right controls ka use karein.
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // 🚨 IMPORTANT: Yahan apna Google Apps Script Web App URL paste karein
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyStz56XZLt9M_dCRxDdzmeAY4ws_iEiiq3Kjldm2c6uN69uRtUCvrTTmnTdUC8hvHj/exec";

        let sheetData = [];

        // 1. Fetch JSON Data from Apps Script
        async function fetchSheetData() {
            try {
                const response = await fetch(SCRIPT_URL);
                sheetData = await response.json();
                
                document.getElementById('data-loader').classList.add('hidden');
                populateClassDropdown();
            } catch (error) {
                console.error("Data fetch error:", error);
                document.getElementById('data-loader').innerText = "⚠️ Data load karne me samasya aayi. Page refresh karein.";
            }
        }

        // 2. Populate Class Dropdown dynamically
        function populateClassDropdown() {
            const classSelect = document.getElementById('class-select');
            // Remove duplicates and filter empty values
            const classes = [...new Set(sheetData.map(item => item.class))].filter(Boolean);
            
            classes.forEach(cls => {
                classSelect.innerHTML += `<option value="${cls}">Class ${cls}</option>`;
            });
        }

        // 3. Handle Class Selection
        function onClassChange() {
            const cls = document.getElementById('class-select').value;
            const subjectSelect = document.getElementById('subject-select');
            const bookSelect = document.getElementById('book-select');
            
            subjectSelect.innerHTML = '<option value="">-- Choose Subject --</option>';
            bookSelect.innerHTML = '<option value="">-- Choose Book Title --</option>';
            bookSelect.disabled = true;
            document.getElementById('chapters-card').classList.add('hidden');

            if (cls) {
                subjectSelect.disabled = false;
                const filtered = sheetData.filter(item => item.class === cls);
                const subjects = [...new Set(filtered.map(item => item.subject))].filter(Boolean);
                
                subjects.forEach(sub => {
                    subjectSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            } else {
                subjectSelect.disabled = true;
            }
        }

        // 4. Handle Subject Selection
        function onSubjectChange() {
            const cls = document.getElementById('class-select').value;
            const sub = document.getElementById('subject-select').value;
            const bookSelect = document.getElementById('book-select');
            
            bookSelect.innerHTML = '<option value="">-- Choose Book Title --</option>';
            document.getElementById('chapters-card').classList.add('hidden');

            if (cls && sub) {
                bookSelect.disabled = false;
                const filtered = sheetData.filter(item => item.class === cls && item.subject === sub);
                const books = [...new Set(filtered.map(item => item.book_name))].filter(Boolean);
                
                books.forEach(bk => {
                    bookSelect.innerHTML += `<option value="${bk}">${bk}</option>`;
                });
            } else {
                bookSelect.disabled = true;
            }
        }

        // 5. Render Chapters List
        function loadChapters() {
            const cls = document.getElementById('class-select').value;
            const sub = document.getElementById('subject-select').value;
            const bk = document.getElementById('book-select').value;

            const listContainer = document.getElementById('chapters-list');
            listContainer.innerHTML = '';

            if (cls && sub && bk) {
                document.getElementById('chapters-card').classList.remove('hidden');
                document.getElementById('book-title-heading').innerText = bk;

                const filtered = sheetData.filter(item => item.class === cls && item.subject === sub && item.book_name === bk);

                filtered.forEach(item => {
                    listContainer.innerHTML += `
                        <div class="flex items-center justify-between bg-slate-50 border p-3.5 rounded-lg hover:bg-indigo-50 transition">
                            <span class="font-semibold text-slate-700">${item.chapter}</span>
                            <button onclick="openSameTabViewer('${item.drive_link}', '${item.chapter}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm">
                                📖 Read Online
                            </button>
                        </div>
                    `;
                });
            }
        }

        // 6. Open Modal Reader
        function openSameTabViewer(drivePreviewLink, chapterTitle) {
    document.getElementById('pdf-modal').classList.remove('hidden');
    document.getElementById('modal-chapter-title').innerText = chapterTitle;
    
    // Drive preview link ko Google Docs Embedded Viewer se wrap kar diya hai
    // Isse saare pages smooth load honge bina memory error ke
    const cleanLink = drivePreviewLink.trim();
    const finalUrl = "https://docs.google.com/viewer?url=" + encodeURIComponent(cleanLink) + "&embedded=true";

    document.getElementById('pdf-frame').src = finalUrl;
}

        // 7. Close Modal Reader
        function closePdfModal() {
            document.getElementById('pdf-modal').classList.add('hidden');
            document.getElementById('pdf-frame').src = '';
        }

        // Initializer
        fetchSheetData();
    </script>
</body>
</html>
