<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPortal - Study Materials Hub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20 font-bold">
                    🎓
                </div>
                <div>
                    <h1 class="text-xl font-extrabold bg-gradient-to-r from-white via-slate-200 to-indigo-300 bg-clip-text text-transparent">
                        EduPortal Study Hub
                    </h1>
                    <p class="text-xs text-slate-400">PDFs, Video Lectures & Assignments Portal</p>
                </div>
            </div>

            <!-- Search & Controls -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative w-full md:w-80">
                    <input type="text" id="search-input" onkeyup="applyFilters()" placeholder="Search topic, title, subject..." 
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                    <span class="absolute left-3.5 top-3 text-slate-500 text-sm">🔍</span>
                </div>
            </div>

        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 flex-1 w-full space-y-6">

        <!-- Category Filter Tabs -->
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="type-filters">
            <button onclick="filterByType('all')" class="type-btn active-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
                ✨ All Materials
            </button>
            <button onclick="filterByType('pdf')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800">
                📄 PDFs & Notes
            </button>
            <button onclick="filterByType('video')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800">
                🎥 Video Lectures
            </button>
            <button onclick="filterByType('assignment')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800">
                📝 Assignments
            </button>
            <button onclick="filterByType('test')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800">
                🧪 Practice Tests
            </button>
        </div>

        <!-- Sheet Selector Tabs (Sheet1, Sheet2, Sheet3) -->
        <div class="flex border-b border-slate-800 space-x-2 overflow-x-auto" id="sheet-tabs">
            <button onclick="switchSheet('Sheet1')" id="tab-Sheet1" class="sheet-btn px-5 py-3 font-semibold text-sm border-b-2 border-indigo-500 text-indigo-400">
                📁 Class 11 Material
            </button>
            <button onclick="switchSheet('Sheet2')" id="tab-Sheet2" class="sheet-btn px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                📁 Class 12 Material
            </button>
            <button onclick="switchSheet('Sheet3')" id="tab-Sheet3" class="sheet-btn px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200">
                📁 Competitive Exams & PYQs
            </button>
        </div>

        <!-- Loading State -->
        <div id="loader" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p class="text-slate-400 text-sm font-medium">Study resources sync ho rahe hain...</p>
        </div>

        <!-- Study Materials Cards Grid -->
        <div id="materials-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 hidden">
            <!-- Dynamic Content Cards Here -->
        </div>

        <!-- Empty Results -->
        <div id="empty-state" class="text-center py-16 hidden">
            <div class="text-4xl mb-3">🔍</div>
            <p class="text-slate-400 text-sm font-medium">Is category ya search filter me koi material nahi mila.</p>
        </div>

    </main>

    <!-- Professional Embedded Resource Modal Viewer -->
    <div id="content-modal" class="fixed inset-0 bg-slate-950/95 hidden z-50 flex flex-col p-2 md:p-4">
        <div class="flex justify-between items-center text-white py-2 px-3 border-b border-slate-800 mb-2">
            <div class="flex items-center space-x-2 overflow-hidden">
                <span id="modal-badge" class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-indigo-600">Resource</span>
                <h3 id="modal-title" class="font-bold text-sm md:text-base text-slate-100 truncate">Material Viewer</h3>
            </div>
            <button onclick="closeModal()" class="bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-md flex items-center gap-1">
                ✕ Close
            </button>
        </div>
        
        <div class="w-full flex-1 bg-slate-900 rounded-xl overflow-hidden relative border border-slate-800">
            <iframe id="modal-frame" src="" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // 🚨 Aapki Google Apps Script Web App URL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyStz56XZLt9M_dCRxDdzmeAY4ws_iEiiq3Kjldm2c6uN69uRtUCvrTTmnTdUC8hvHj/exec";

        let allMaterials = [];
        let currentSheet = "Sheet1";
        let currentTypeFilter = "all";

        // Fetch Data from Google Apps Script
        async function fetchMaterials(sheetName) {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('materials-grid').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');

            try {
                const response = await fetch(`${SCRIPT_URL}?sheet=${sheetName}`);
                allMaterials = await response.json();

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('materials-grid').classList.remove('hidden');

                applyFilters();
            } catch (error) {
                console.error("Error fetching study materials:", error);
                document.getElementById('loader').innerHTML = `<p class="text-red-400 text-sm">⚠️ Data load karne me samasya aayi. Page refresh karein.</p>`;
            }
        }

        // Apply Search and Filters
        function applyFilters() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            const filtered = allMaterials.filter(item => {
                const title = (item.title || item.chapter || item.book_name || "").toLowerCase();
                const subject = (item.subject || "").toLowerCase();
                const type = (item.type || "pdf").toLowerCase();

                const matchesSearch = title.includes(searchQuery) || subject.includes(searchQuery);
                const matchesType = currentTypeFilter === "all" || type === currentTypeFilter;

                return matchesSearch && matchesType;
            });

            renderGrid(filtered);
        }

        // Render Cards UI
        function renderGrid(items) {
            const grid = document.getElementById('materials-grid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            items.forEach(item => {
                const title = item.title || item.chapter || "Study Resource";
                const subject = item.subject || "General";
                const type = (item.type || "pdf").toLowerCase();
                const link = item.link || item.drive_link || "#";

                // Design Badge & Action Icon according to Resource Type
                let badgeStyle = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                let icon = "📄";
                let btnText = "Read PDF";

                if (type === "video") {
                    badgeStyle = "bg-red-500/10 text-red-400 border-red-500/20";
                    icon = "🎥";
                    btnText = "Watch Video";
                } else if (type === "assignment") {
                    badgeStyle = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                    icon = "📝";
                    btnText = "Open Work";
                } else if (type === "test") {
                    badgeStyle = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                    icon = "🧪";
                    btnText = "Start Test";
                }

                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800/80 hover:border-indigo-500/50 rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/10 group">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg border ${badgeStyle} flex items-center gap-1.5">
                                    <span>${icon}</span> ${type}
                                </span>
                                <span class="text-xs text-slate-400 font-medium">${subject}</span>
                            </div>

                            <h3 class="text-slate-100 font-bold text-base mb-2 group-hover:text-indigo-400 transition line-clamp-2 leading-snug">
                                ${title}
                            </h3>
                        </div>

                        <div class="mt-5 pt-4 border-t border-slate-800/60 flex items-center justify-between">
                            <span class="text-xs text-slate-400">Available Online</span>
                            <button onclick="openResource('${link}', '${type}', '${title}')" 
                                class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center gap-1.5">
                                ${btnText}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Handle Resource Types in Modal
        function openResource(link, type, title) {
            document.getElementById('content-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-badge').innerText = type;

            let finalUrl = link.trim();

            // Drive Preview formatting
            const driveMatch = finalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                finalUrl = `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
            } 
            // YouTube Video Embed conversion
            else if (finalUrl.includes('youtube.com/watch') || finalUrl.includes('youtu.be')) {
                let videoId = "";
                if(finalUrl.includes('youtu.be')) {
                    videoId = finalUrl.split('/').pop().split('?')[0];
                } else {
                    const urlParams = new URLSearchParams(new URL(finalUrl).search);
                    videoId = urlParams.get('v');
                }
                finalUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }

            document.getElementById('modal-frame').src = finalUrl;
        }

        function closeModal() {
            document.getElementById('content-modal').classList.add('hidden');
            document.getElementById('modal-frame').src = '';
        }

        // Sheet Tab Change
        function switchSheet(sheetName) {
            currentSheet = sheetName;
            document.querySelectorAll('.sheet-btn').forEach(btn => {
                btn.className = "sheet-btn px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-slate-400 hover:text-slate-200";
            });
            document.getElementById(`tab-${sheetName}`).className = "sheet-btn px-5 py-3 font-semibold text-sm border-b-2 border-indigo-500 text-indigo-400";
            fetchMaterials(sheetName);
        }

        // Type Filter Change
        function filterByType(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.className = "type-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-slate-900 border border-slate-800 text-slate-400 hover:text-white hover:bg-slate-800";
            });
            event.currentTarget.className = "type-btn active-btn px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
            applyFilters();
        }

        // Initializer
        fetchMaterials('Sheet1');
    </script>
</body>
</html>
