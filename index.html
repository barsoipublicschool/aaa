<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCERT e-Pathshala Library (Class 6 - 12)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- StPageFlip for 3D Book Turn Effect -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <!-- PDF.js Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        .container-book { display: flex; justify-content: center; align-items: center; min-height: 80vh; }
        .page { padding: 5px; background-color: #fff; border: 1px solid #ddd; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md p-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">📚</span>
            <div>
                <h1 class="text-xl font-bold">NCERT Online Digital Library</h1>
                <p class="text-xs text-indigo-200">Class 6 to 12 - Interactive Flipbook Reader</p>
            </div>
        </div>
    </header>

    <!-- Main Section -->
    <main class="container mx-auto max-w-5xl p-4 flex-1">

        <!-- Selection Panel (ePathshala Style Dropdowns) -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6 border border-indigo-100">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Select Your Book Details:</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Class Dropdown -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Class:</label>
                    <select id="class-select" onchange="onClassChange()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                        <option value="">-- Choose Class --</option>
                        <option value="6">Class 6</option>
                        <option value="7">Class 7</option>
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10">Class 10</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>

                <!-- Subject Dropdown -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Subject:</label>
                    <select id="subject-select" onchange="onSubjectChange()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500" disabled>
                        <option value="">-- Choose Subject --</option>
                    </select>
                </div>

                <!-- Book Title Dropdown -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Book Title:</label>
                    <select id="book-select" onchange="loadChapters()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500" disabled>
                        <option value="">-- Choose Book --</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Chapters List View -->
        <div id="chapters-card" class="bg-white p-6 rounded-lg shadow-md hidden border border-slate-200">
            <h3 id="book-title-heading" class="text-xl font-bold text-indigo-900 mb-4 border-b pb-2">Available Chapters</h3>
            <div id="chapters-list" class="space-y-3">
                <!-- Chapters will render dynamically here -->
            </div>
        </div>

    </main>

    <!-- Modal for 3D Book Flip Viewer -->
    <div id="flipbook-modal" class="fixed inset-0 bg-slate-950/90 hidden z-50 flex flex-col justify-between p-4">
        <div class="flex justify-between items-center text-white px-4">
            <span id="modal-chapter-title" class="font-bold text-lg">Reading Mode</span>
            <button onclick="closeFlipbook()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-1.5 rounded transition">✕ Close Book</button>
        </div>
        
        <div class="container-book" id="book-container">
            <div id="loading-spinner" class="text-white text-lg">Book Loading... Please wait...</div>
            <div id="book"></div>
        </div>

        <div class="text-center text-slate-400 text-xs pb-2">
            Tip: Click or Drag the page edges to flip pages.
        </div>
    </div>

    <!-- Data Engine & Reader JS -->
    <script>
        // Demo PDF path (Aap yahan apni NCERT PDF ke links replace kar sakte hain)
        const SAMPLE_PDF = "https://raw.githubusercontent.com/mozilla/pdf.js/ba2edeae/web/compressed.tracemonkey-pldi-09.pdf";

        // NCERT Data Structure (Class 6 to 12)
        const ncertDatabase = {
            "6": {
                "Science": { "Curiosity (Science)": [{ name: "Chapter 1: Components of Food", pdf: SAMPLE_PDF }, { name: "Chapter 2: Sorting Materials Into Groups", pdf: SAMPLE_PDF }] },
                "Mathematics": { "Ganita Prakash": [{ name: "Chapter 1: Patterns in Mathematics", pdf: SAMPLE_PDF }, { name: "Chapter 2: Lines and Angles", pdf: SAMPLE_PDF }] }
            },
            "7": {
                "Science": { "Science TextBook Class 7": [{ name: "Chapter 1: Nutrition in Plants", pdf: SAMPLE_PDF }, { name: "Chapter 2: Nutrition in Animals", pdf: SAMPLE_PDF }] },
                "Social Science": { "Our Pasts - II": [{ name: "Chapter 1: Tracing Changes Through A Thousand Years", pdf: SAMPLE_PDF }] }
            },
            "8": {
                "Science": { "Science TextBook Class 8": [{ name: "Chapter 1: Crop Production and Management", pdf: SAMPLE_PDF }] },
                "Mathematics": { "Mathematics Class 8": [{ name: "Chapter 1: Rational Numbers", pdf: SAMPLE_PDF }] }
            },
            "9": {
                "Science": { "Science TextBook Class 9": [{ name: "Chapter 1: Matter in Our Surroundings", pdf: SAMPLE_PDF }, { name: "Chapter 2: Is Matter Around Us Pure", pdf: SAMPLE_PDF }] },
                "Mathematics": { "Mathematics Class 9": [{ name: "Chapter 1: Number Systems", pdf: SAMPLE_PDF }] }
            },
            "10": {
                "Science": { "Science TextBook Class 10": [{ name: "Chapter 1: Chemical Reactions and Equations", pdf: SAMPLE_PDF }, { name: "Chapter 6: Life Processes", pdf: SAMPLE_PDF }] },
                "Mathematics": { "Mathematics Class 10": [{ name: "Chapter 1: Real Numbers", pdf: SAMPLE_PDF }] }
            },
            "11": {
                "Biology": { "Biology Class 11": [{ name: "Chapter 1: The Living World", pdf: SAMPLE_PDF }, { name: "Chapter 2: Biological Classification", pdf: SAMPLE_PDF }, { name: "Chapter 3: Plant Kingdom", pdf: SAMPLE_PDF }, { name: "Chapter 4: Animal Kingdom", pdf: SAMPLE_PDF }] },
                "Physics": { "Physics Part-I": [{ name: "Chapter 1: Units and Measurements", pdf: SAMPLE_PDF }] },
                "Chemistry": { "Chemistry Part-I": [{ name: "Chapter 1: Some Basic Concepts of Chemistry", pdf: SAMPLE_PDF }] }
            },
            "12": {
                "Biology": { "Biology Class 12": [{ name: "Chapter 1: Sexual Reproduction in Flowering Plants", pdf: SAMPLE_PDF }, { name: "Chapter 2: Human Reproduction", pdf: SAMPLE_PDF }, { name: "Chapter 3: Reproductive Health", pdf: SAMPLE_PDF }, { name: "Chapter 4: Principles of Inheritance and Variation", pdf: SAMPLE_PDF }] },
                "Chemistry": { "Chemistry Part-I": [{ name: "Chapter 1: Solutions", pdf: SAMPLE_PDF }, { name: "Chapter 2: Electrochemistry", pdf: SAMPLE_PDF }] },
                "Physics": { "Physics Part-I": [{ name: "Chapter 1: Electric Charges and Fields", pdf: SAMPLE_PDF }] }
            }
        };

        const classSelect = document.getElementById('class-select');
        const subjectSelect = document.getElementById('subject-select');
        const bookSelect = document.getElementById('book-select');

        function onClassChange() {
            const cls = classSelect.value;
            subjectSelect.innerHTML = '<option value="">-- Choose Subject --</option>';
            bookSelect.innerHTML = '<option value="">-- Choose Book --</option>';
            bookSelect.disabled = true;

            if (cls && ncertDatabase[cls]) {
                subjectSelect.disabled = false;
                Object.keys(ncertDatabase[cls]).forEach(sub => {
                    subjectSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            } else {
                subjectSelect.disabled = true;
            }
            document.getElementById('chapters-card').classList.add('hidden');
        }

        function onSubjectChange() {
            const cls = classSelect.value;
            const sub = subjectSelect.value;
            bookSelect.innerHTML = '<option value="">-- Choose Book --</option>';

            if (cls && sub && ncertDatabase[cls][sub]) {
                bookSelect.disabled = false;
                Object.keys(ncertDatabase[cls][sub]).forEach(bk => {
                    bookSelect.innerHTML += `<option value="${bk}">${bk}</option>`;
                });
            } else {
                bookSelect.disabled = true;
            }
            document.getElementById('chapters-card').classList.add('hidden');
        }

        function loadChapters() {
            const cls = classSelect.value;
            const sub = subjectSelect.value;
            const bk = bookSelect.value;

            const listContainer = document.getElementById('chapters-list');
            listContainer.innerHTML = '';

            if (cls && sub && bk && ncertDatabase[cls][sub][bk]) {
                document.getElementById('chapters-card').classList.remove('hidden');
                document.getElementById('book-title-heading').innerText = bk + " (Chapters)";

                ncertDatabase[cls][sub][bk].forEach((ch) => {
                    listContainer.innerHTML += `
                        <div class="flex items-center justify-between bg-slate-50 border p-3.5 rounded-lg hover:bg-indigo-50 transition">
                            <span class="font-medium text-slate-700">${ch.name}</span>
                            <button onclick="openFlipbook('${ch.pdf}', '${ch.name}')" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-sm flex items-center gap-1">
                                📖 Read as Book
                            </button>
                        </div>
                    `;
                });
            }
        }

        // PDF Flipbook Engine Setup
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        let pageFlip = null;

        async function openFlipbook(pdfUrl, chapterTitle) {
            document.getElementById('flipbook-modal').classList.remove('hidden');
            document.getElementById('modal-chapter-title').innerText = chapterTitle;
            const bookElement = document.getElementById('book');
            const spinner = document.getElementById('loading-spinner');
            
            spinner.style.display = 'block';
            bookElement.innerHTML = ''; 

            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1.2 });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/jpeg');
                    img.style.width = '100%';
                    img.style.height = '100%';
                    
                    pageDiv.appendChild(img);
                    bookElement.appendChild(pageDiv);
                }

                spinner.style.display = 'none';

                // Turn.js / PageFlip Initialization
                pageFlip = new St.PageFlip(bookElement, {
                    width: 450,
                    height: 600,
                    size: "stretch",
                    minWidth: 320,
                    maxWidth: 550,
                    minHeight: 450,
                    maxHeight: 750,
                    maxShadowOpacity: 0.5,
                    showCover: true
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            } catch (error) {
                alert('PDF Rendering Me Issue Aaya hai. Direct File URL check karein.');
                closeFlipbook();
            }
        }

        function closeFlipbook() {
            document.getElementById('flipbook-modal').classList.add('hidden');
            if(pageFlip) {
                pageFlip.destroy();
            }
        }
    </script>
</body>
</html>
