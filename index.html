<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduCloud Studio</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .card-glow {
      background: #111827;
      border: 1px solid #1f2937;
    }
    .card-glow:hover {
      border-color: #3b82f6;
    }
  </style>
</head>
<body class="p-4 max-w-4xl mx-auto">

  <!-- NCERT Books Banner (Open Portal Text Removed) -->
  <div class="card-glow rounded-2xl p-4 flex items-center justify-between border border-amber-500/30 bg-amber-500/5 mb-6">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-xl bg-amber-500/10 flex items-center justify-center text-2xl">
        📚
      </div>
      <div>
        <h3 class="font-bold text-white text-lg">NCERT Books</h3>
        <p class="text-xs text-gray-400">Official Portal (E-Books & Textbooks)</p>
      </div>
    </div>
    <!-- "Open Portal" text is removed as requested -->
  </div>

  <!-- Cards Container -->
  <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <!-- Dynamic Content Will Load Here -->
  </div>

  <script>
    // Visual layout rendering logic for cards
    function renderCards(dataList) {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';

      dataList.forEach(item => {
        // Updated Column Mapping:
        // item[0] = Class (A)
        // item[1] = Subject (B)
        // item[2] = Title (C)
        // item[3] = Type (D)
        // item[4] = Link (E)
        
        const itemClass = item[0] || 'Class N/A';
        const subject = item[1] || 'General';
        const title = item[2] || 'Untitled Resource';
        const type = item[3] || 'PDF';
        const link = item[4] || '#';

        const card = document.createElement('div');
        card.className = "card-glow rounded-2xl p-5 border border-slate-800 flex flex-col justify-between space-y-4";

        card.innerHTML = `
          <div>
            <!-- Top Row: Type Tag & Class/Subject Info -->
            <div class="flex items-center justify-between text-xs font-semibold mb-3">
              <span class="px-2.5 py-1 rounded-md bg-blue-500/10 text-blue-400 border border-blue-500/20 uppercase tracking-wider flex items-center gap-1.5">
                <i class="fa-solid fa-file-pdf"></i> ${type}
              </span>
              <span class="text-gray-400 text-right">
                <span class="text-blue-400 font-medium">${itemClass}</span> • ${subject}
              </span>
            </div>

            <!-- Main Title (Where Study Material was previously written) -->
            <h2 class="text-xl font-bold text-white leading-snug tracking-wide">
              ${title}
            </h2>
          </div>

          <!-- Bottom Row: Action Button -->
          <div class="flex items-center justify-between pt-2 border-t border-slate-800/60">
            <span class="text-xs text-gray-400">Ready to Access</span>
            <a href="${link}" target="_blank" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold rounded-xl transition shadow-lg shadow-indigo-600/30 flex items-center gap-2">
              Read ${type}
            </a>
          </div>
        `;

        container.appendChild(card);
      });
    }

    // Example Usage with sample data structure [Class, Subject, Title, Type, Link]
    const sampleData = [
      [
        "Class 12th", 
        "Zoology", 
        "Reproduction in Flowering Plants", 
        "PDF", 
        "https://example.com/file.pdf"
      ]
    ];

    // Page Load Par Run Karne Ke Liye:
    renderCards(sampleData);
  </script>
</body>
</html>
