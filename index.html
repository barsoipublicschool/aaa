<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NCERT Digital Library</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navbar Header -->
    <header class="bg-indigo-700 text-white shadow-md p-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <span class="text-3xl">📚</span>
            <div>
                <h1 class="text-xl font-bold">NCERT Digital Library</h1>
                <p class="text-xs text-indigo-200">Class 6 to 12 - Same Tab Reader Mode</p>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto max-w-5xl p-4 flex-1">

        <!-- Selection Card -->
        <div class="bg-white p-6 rounded-lg shadow-md mb-6 border border-indigo-100">
            <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">Select Your Book Details:</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                
                <!-- Class Selection -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Class:</label>
                    <select id="class-select" onchange="onClassChange()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500">
                        <option value="">-- Choose Class --</option>
                        <option value="6">Class 6</option>
                        <option value="7">Class 7</option>
                        <option value="8">Class 8</option>
                        <option value="9">Class 9</option>
                        <option value="10">Class 10</option>
                        <option value="11">Class 11</option>
                        <option value="12">Class 12</option>
                    </select>
                </div>

                <!-- Subject Selection -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Subject:</label>
                    <select id="subject-select" onchange="onSubjectChange()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500" disabled>
                        <option value="">-- Choose Subject --</option>
                    </select>
                </div>

                <!-- Book Title Selection -->
                <div>
                    <label class="block text-sm font-semibold mb-1 text-slate-600">Select Book Title:</label>
                    <select id="book-select" onchange="loadChapters()" class="w-full p-2.5 border rounded-lg bg-slate-50 focus:ring-2 focus:ring-indigo-500" disabled>
                        <option value="">-- Choose Book Title --</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Chapters View List -->
        <div id="chapters-card" class="bg-white p-6 rounded-lg shadow-md hidden border border-slate-200">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 id="book-title-heading" class="text-xl font-bold text-indigo-900">All Available Chapters</h3>
                <span class="text-xs bg-indigo-100 text-indigo-800 font-semibold px-2.5 py-1 rounded-full">In-App Reader</span>
            </div>
            <div id="chapters-list" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
        </div>

    </main>

    <!-- App Data & Logic -->
    <script>
        const ncertMaster = {
            "6": {
                "Science": { 
                    "Curiosity (English Medium)": { totalChapters: 12, code: "fesc1" },
                    "जिज्ञासा (Hindi Medium)": { totalChapters: 12, code: "fhsc1" }
                },
                "Mathematics": { 
                    "Ganita Prakash (English Medium)": { totalChapters: 10, code: "fema1" },
                    "गणित प्रकाश (Hindi Medium)": { totalChapters: 10, code: "fhma1" }
                }
            },
            "7": {
                "Science": { 
                    "Science (English Medium)": { totalChapters: 13, code: "gesc1" },
                    "विज्ञान (Hindi Medium)": { totalChapters: 13, code: "ghsc1" }
                },
                "Mathematics": { 
                    "Mathematics (English Medium)": { totalChapters: 13, code: "gema1" },
                    "गणित (Hindi Medium)": { totalChapters: 13, code: "ghma1" }
                }
            },
            "8": {
                "Science": { 
                    "Science (English Medium)": { totalChapters: 13, code: "hesc1" },
                    "विज्ञान (Hindi Medium)": { totalChapters: 13, code: "hhsc1" }
                },
                "Mathematics": { 
                    "Mathematics (English Medium)": { totalChapters: 13, code: "hema1" },
                    "गणित (Hindi Medium)": { totalChapters: 13, code: "hhma1" }
                }
            },
            "9": {
                "Science": { 
                    "Science (English Medium)": { totalChapters: 12, code: "iesc1" },
                    "विज्ञान (Hindi Medium)": { totalChapters: 12, code: "ihsc1" }
                },
                "Mathematics": { 
                    "Mathematics (English Medium)": { totalChapters: 12, code: "iema1" },
                    "गणित (Hindi Medium)": { totalChapters: 12, code: "ihma1" }
                }
            },
            "10": {
                "Science": { 
                    "Science (English Medium)": { totalChapters: 13, code: "jesc1" },
                    "विज्ञान (Hindi Medium)": { totalChapters: 13, code: "jhsc1" }
                },
                "Mathematics": { 
                    "Mathematics (English Medium)": { totalChapters: 14, code: "jema1" },
                    "गणित (Hindi Medium)": { totalChapters: 14, code: "jhma1" }
                }
            },
            "11": {
                "Biology": { 
                    "Biology Class 11 (English)": { totalChapters: 19, code: "kebo1" },
                    "जीव विज्ञान Class 11 (Hindi)": { totalChapters: 19, code: "khbo1" }
                },
                "Physics": { 
                    "Physics Part-I (English)": { totalChapters: 7, code: "keph1" },
                    "Physics Part-II (English)": { totalChapters: 7, code: "keph2" },
                    "भौतिकी भाग-I (Hindi)": { totalChapters: 7, code: "khph1" },
                    "भौतिकी भाग-II (Hindi)": { totalChapters: 7, code: "khph2" }
                },
                "Chemistry": { 
                    "Chemistry Part-I (English)": { totalChapters: 5, code: "kech1" },
                    "Chemistry Part-II (English)": { totalChapters: 4, code: "kech2" },
                    "रसायन विज्ञान भाग-I (Hindi)": { totalChapters: 5, code: "khch1" },
                    "रसायन विज्ञान भाग-II (Hindi)": { totalChapters: 4, code: "khch2" }
                },
                "Mathematics": { 
                    "Mathematics (English)": { totalChapters: 14, code: "kema1" },
                    "गणित (Hindi)": { totalChapters: 14, code: "khma1" }
                }
            },
            "12": {
                "Biology": { 
                    "Biology Class 12 (English)": { totalChapters: 13, code: "lebo1" },
                    "जीव विज्ञान Class 12 (Hindi)": { totalChapters: 13, code: "lhbo1" }
                },
                "Physics": { 
                    "Physics Part-I (English)": { totalChapters: 8, code: "leph1" },
                    "Physics Part-II (English)": { totalChapters: 6, code: "leph2" },
                    "भौतिकी भाग-I (Hindi)": { totalChapters: 8, code: "lhph1" },
                    "भौतिकी भाग-II (Hindi)": { totalChapters: 6, code: "lhph2" }
                },
                "Chemistry": { 
                    "Chemistry Part-I (English)": { totalChapters: 5, code: "lech1" },
                    "Chemistry Part-II (English)": { totalChapters: 5, code: "lech2" },
                    "रसायन विज्ञान भाग-I (Hindi)": { totalChapters: 5, code: "lhch1" },
                    "रसायन विज्ञान भाग-II (Hindi)": { totalChapters: 5, code: "lhch2" }
                },
                "Mathematics": { 
                    "Mathematics Part-I (English)": { totalChapters: 6, code: "lema1" },
                    "Mathematics Part-II (English)": { totalChapters: 7, code: "lema2" },
                    "गणित भाग-I (Hindi)": { totalChapters: 6, code: "lhma1" },
                    "गणित भाग-II (Hindi)": { totalChapters: 7, code: "lhma2" }
                }
            }
        };

        const classSelect = document.getElementById('class-select');
        const subjectSelect = document.getElementById('subject-select');
        const bookSelect = document.getElementById('book-select');

        function onClassChange() {
            const cls = classSelect.value;
            subjectSelect.innerHTML = '<option value="">-- Choose Subject --</option>';
            bookSelect.innerHTML = '<option value="">-- Choose Book Title --</option>';
            bookSelect.disabled = true;

            if (cls && ncertMaster[cls]) {
                subjectSelect.disabled = false;
                Object.keys(ncertMaster[cls]).forEach(sub => {
                    subjectSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
                });
            } else {
                subjectSelect.disabled = true;
            }
            document.getElementById('chapters-card').classList.add('hidden');
        }

        function onSubjectChange() {
            const cls = classSelect.value;
            const sub = subjectSelect.value;
            bookSelect.innerHTML = '<option value="">-- Choose Book Title --</option>';

            if (cls && sub && ncertMaster[cls][sub]) {
                bookSelect.disabled = false;
                Object.keys(ncertMaster[cls][sub]).forEach(bk => {
                    bookSelect.innerHTML += `<option value="${bk}">${bk}</option>`;
                });
            } else {
                bookSelect.disabled = true;
            }
            document.getElementById('chapters-card').classList.add('hidden');
        }

        function loadChapters() {
            const cls = classSelect.value;
            const sub = subjectSelect.value;
            const bk = bookSelect.value;

            const listContainer = document.getElementById('chapters-list');
            listContainer.innerHTML = '';

            if (cls && sub && bk && ncertMaster[cls][sub][bk]) {
                document.getElementById('chapters-card').classList.remove('hidden');
                document.getElementById('book-title-heading').innerText = bk + " (All Chapters)";

                const bookInfo = ncertMaster[cls][sub][bk];
                
                for (let i = 1; i <= bookInfo.totalChapters; i++) {
                    const chNum = i < 10 ? '0' + i : i;
                    const rawPdf = `https://ncert.nic.in/textbook/pdf/${bookInfo.code}${chNum}.pdf`;
                    
                    // Same tab navigation link
                    const customViewerUrl = `assets/viewer.html?file=${encodeURIComponent(rawPdf)}`;

                    listContainer.innerHTML += `
                        <div class="flex items-center justify-between bg-slate-50 border p-3.5 rounded-lg hover:bg-indigo-50 transition">
                            <span class="font-semibold text-slate-700">Chapter ${i}</span>
                            <a href="${customViewerUrl}" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-4 py-2 rounded-lg shadow-sm flex items-center gap-1.5">
                                📖 Read Online
                            </a>
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
