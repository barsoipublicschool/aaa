<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduCloud - Ultimate Study Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

    <!-- Top Header -->
    <header class="bg-slate-900/90 border-b border-slate-800/80 sticky top-0 z-40 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 rounded-2xl flex items-center justify-center text-xl shadow-lg shadow-indigo-500/20 font-black">
                    🚀
                </div>
                <div>
                    <h1 class="text-xl font-extrabold bg-gradient-to-r from-white via-slate-100 to-indigo-300 bg-clip-text text-transparent">
                        EduCloud Studio
                    </h1>
                    <p class="text-[11px] text-slate-400 font-medium">Smart Digital Resource Dashboard</p>
                </div>
            </div>

            <!-- Global Search Bar -->
            <div class="relative w-full max-w-xs sm:max-w-md">
                <input type="text" id="search-input" onkeyup="applyFilters()" placeholder="Search topic, subject or title..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition shadow-inner">
                <span class="absolute left-3.5 top-2.5 text-slate-500 text-sm">🔍</span>
            </div>

        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6 flex-1 w-full space-y-6">

        <!-- Top Metrics / Quick Stats Row -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3.5">
                <div class="p-3 bg-indigo-500/10 text-indigo-400 rounded-xl text-xl">📚</div>
                <div>
                    <div id="stat-total" class="text-lg font-bold text-slate-100">0</div>
                    <div class="text-xs text-slate-400">Total Items</div>
                </div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3.5">
                <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl text-xl">📄</div>
                <div>
                    <div id="stat-pdf" class="text-lg font-bold text-slate-100">0</div>
                    <div class="text-xs text-slate-400">PDFs & Notes</div>
                </div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3.5">
                <div class="p-3 bg-red-500/10 text-red-400 rounded-xl text-xl">🎥</div>
                <div>
                    <div id="stat-video" class="text-lg font-bold text-slate-100">0</div>
                    <div class="text-xs text-slate-400">Video Lectures</div>
                </div>
            </div>
            <div class="bg-slate-900/60 border border-slate-800/80 rounded-2xl p-4 flex items-center gap-3.5">
                <div class="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl text-xl">📝</div>
                <div>
                    <div id="stat-assignment" class="text-lg font-bold text-slate-100">0</div>
                    <div class="text-xs text-slate-400">Assignments</div>
                </div>
            </div>
        </div>

        <!-- Sheet Selector Tabs (Class 11, 12, Competitive Exams) -->
        <div class="bg-slate-900/80 p-1.5 rounded-2xl border border-slate-800 flex items-center gap-2 overflow-x-auto scrollbar-none" id="sheet-tabs">
            <button onclick="switchSheet('Sheet1')" id="tab-Sheet1" class="sheet-btn flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30">
                📁 Class 11 Material
            </button>
            <button onclick="switchSheet('Sheet2')" id="tab-Sheet2" class="sheet-btn flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
                📁 Class 12 Material
            </button>
            <button onclick="switchSheet('Sheet3')" id="tab-Sheet3" class="sheet-btn flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800/60">
                📁 Competitive / PYQs
            </button>
        </div>

        <!-- Type Filter Chips -->
        <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none" id="type-filters">
            <button onclick="filterByType('all')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-800 text-white border border-slate-700">
                ✨ All Items
            </button>
            <button onclick="filterByType('pdf')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-900/90 text-slate-400 border border-slate-800 hover:text-slate-200">
                📄 PDFs & Notes
            </button>
            <button onclick="filterByType('video')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-900/90 text-slate-400 border border-slate-800 hover:text-slate-200">
                🎥 Video Lectures
            </button>
            <button onclick="filterByType('assignment')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-900/90 text-slate-400 border border-slate-800 hover:text-slate-200">
                📝 Assignments
            </button>
            <button onclick="filterByType('test')" class="type-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-900/90 text-slate-400 border border-slate-800 hover:text-slate-200">
                🧪 Practice Tests
            </button>
        </div>

        <!-- Loading Spinner State -->
        <div id="loader" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent mb-4"></div>
            <p id="loader-msg" class="text-slate-400 text-sm font-medium">Dashboard resources syncing...</p>
        </div>

        <!-- Dynamic Study Material Grid -->
        <div id="materials-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 hidden">
            <!-- Cards JS Rendered -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-16 hidden">
            <div class="text-4xl mb-3">🔍</div>
            <p class="text-slate-400 text-sm font-medium">Koi resource nahi mil sanka. Search query ya filter badlein.</p>
        </div>

    </main>

    <!-- Embedded Content Modal -->
    <div id="content-modal" class="fixed inset-0 bg-slate-950/95 hidden z-50 flex flex-col p-2 md:p-4">
        <div class="flex justify-between items-center text-white py-2 px-3 border-b border-slate-800 mb-2">
            <div class="flex items-center space-x-2 overflow-hidden">
                <span id="modal-badge" class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-indigo-600">VIEWER</span>
                <h3 id="modal-title" class="font-bold text-sm md:text-base text-slate-100 truncate">Resource Preview</h3>
            </div>
            <button onclick="closeModal()" class="bg-red-600/80 hover:bg-red-600 text-white text-xs font-bold px-4 py-2 rounded-lg transition shadow-md flex items-center gap-1">
                ✕ Close
            </button>
        </div>
        
        <div class="w-full flex-1 bg-slate-900 rounded-xl overflow-hidden relative border border-slate-800">
            <iframe id="modal-frame" src="" class="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyStz56XZLt9M_dCRxDdzmeAY4ws_iEiiq3Kjldm2c6uN69uRtUCvrTTmnTdUC8hvHj/exec";

        let allMaterials = [];
        let currentSheet = "Sheet1";
        let currentTypeFilter = "all";

        // Fetch Data from Google Apps Script
        async function fetchMaterials(sheetName) {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('materials-grid').classList.add('hidden');
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('loader-msg').innerText = "Dashboard resources syncing...";

            try {
                const response = await fetch(`${SCRIPT_URL}?sheet=${sheetName}`);
                allMaterials = await response.json();

                document.getElementById('loader').classList.add('hidden');
                document.getElementById('materials-grid').classList.remove('hidden');

                updateStats();
                applyFilters();
            } catch (error) {
                console.error("Data Fetching Error:", error);
                document.getElementById('loader-msg').innerHTML = `<span class="text-red-400">⚠️ Data load nahi ho saka. Sheet Web App re-deploy karein.</span>`;
            }
        }

        // Quick Stats Update
        function updateStats() {
            document.getElementById('stat-total').innerText = allMaterials.length;
            document.getElementById('stat-pdf').innerText = allMaterials.filter(i => (i.type||'pdf').toLowerCase() === 'pdf').length;
            document.getElementById('stat-video').innerText = allMaterials.filter(i => (i.type||'').toLowerCase() === 'video').length;
            document.getElementById('stat-assignment').innerText = allMaterials.filter(i => (i.type||'').toLowerCase() === 'assignment').length;
        }

        // Filter Logic
        function applyFilters() {
            const searchQuery = document.getElementById('search-input').value.toLowerCase();

            const filtered = allMaterials.filter(item => {
                const title = (item.title || item.chapter || item.book_name || "").toLowerCase();
                const subject = (item.subject || "").toLowerCase();
                const type = (item.type || "pdf").toLowerCase();

                const matchesSearch = title.includes(searchQuery) || subject.includes(searchQuery);
                const matchesType = currentTypeFilter === "all" || type === currentTypeFilter;

                return matchesSearch && matchesType;
            });

            renderGrid(filtered);
        }

        // Render Cards UI
        function renderGrid(items) {
            const grid = document.getElementById('materials-grid');
            grid.innerHTML = '';

            if (!items || items.length === 0) {
                document.getElementById('empty-state').classList.remove('hidden');
                return;
            } else {
                document.getElementById('empty-state').classList.add('hidden');
            }

            items.forEach(item => {
                const title = item.title || item.chapter || item.book_name || "Study Resource";
                const subject = item.subject || "General";
                const type = (item.type || "pdf").toLowerCase();
                const link = item.link || item.drive_link || "#";

                let badgeStyle = "bg-blue-500/10 text-blue-400 border-blue-500/20";
                let icon = "📄";
                let btnText = "Read PDF";

                if (type === "video") {
                    badgeStyle = "bg-red-500/10 text-red-400 border-red-500/20";
                    icon = "🎥";
                    btnText = "Watch Video";
                } else if (type === "assignment") {
                    badgeStyle = "bg-emerald-500/10 text-emerald-400 border-emerald-500/20";
                    icon = "📝";
                    btnText = "Open Work";
                } else if (type === "test") {
                    badgeStyle = "bg-amber-500/10 text-amber-400 border-amber-500/20";
                    icon = "🧪";
                    btnText = "Start Test";
                }

                grid.innerHTML += `
                    <div class="bg-slate-900/90 border border-slate-800/90 hover:border-indigo-500/50 rounded-2xl p-5 flex flex-col justify-between transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/10 group">
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <span class="text-[11px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg border ${badgeStyle} flex items-center gap-1.5">
                                    <span>${icon}</span> ${type}
                                </span>
                                <span class="text-xs text-slate-400 font-medium">${subject}</span>
                            </div>

                            <h3 class="text-slate-100 font-bold text-base mb-2 group-hover:text-indigo-400 transition line-clamp-2 leading-snug">
                                ${title}
                            </h3>
                        </div>

                        <div class="mt-5 pt-4 border-t border-slate-800/80 flex items-center justify-between">
                            <span class="text-xs text-slate-400">Ready to Access</span>
                            <button onclick="openResource('${link}', '${type}', '${title}')" 
                                class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center gap-1.5">
                                ${btnText}
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        // Open Modal Handler
        function openResource(link, type, title) {
            document.getElementById('content-modal').classList.remove('hidden');
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-badge').innerText = type;

            let finalUrl = link.trim();

            const driveMatch = finalUrl.match(/\/d\/([a-zA-Z0-9_-]+)/);
            if (driveMatch && driveMatch[1]) {
                finalUrl = `https://drive.google.com/file/d/${driveMatch[1]}/preview`;
            } 
            else if (finalUrl.includes('youtube.com/watch') || finalUrl.includes('youtu.be')) {
                let videoId = "";
                if(finalUrl.includes('youtu.be')) {
                    videoId = finalUrl.split('/').pop().split('?')[0];
                } else {
                    const urlParams = new URLSearchParams(new URL(finalUrl).search);
                    videoId = urlParams.get('v');
                }
                finalUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            }

            document.getElementById('modal-frame').src = finalUrl;
        }

        function closeModal() {
            document.getElementById('content-modal').classList.add('hidden');
            document.getElementById('modal-frame').src = '';
        }

        function switchSheet(sheetName) {
            currentSheet = sheetName;
            document.querySelectorAll('.sheet-btn').forEach(btn => {
                btn.className = "sheet-btn flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800/60";
            });
            document.getElementById(`tab-${sheetName}`).className = "sheet-btn flex-1 min-w-[140px] py-2.5 px-4 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-lg shadow-indigo-600/30";
            fetchMaterials(sheetName);
        }

        function filterByType(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.className = "type-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-900/90 text-slate-400 border border-slate-800 hover:text-slate-200";
            });
            event.currentTarget.className = "type-btn px-4 py-2 rounded-xl text-xs font-bold transition bg-slate-800 text-white border border-slate-700";
            applyFilters();
        }

        // Init
        fetchMaterials('Sheet1');
    </script>
</body>
</html>
