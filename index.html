<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Material & Library Portal</title>
    <!-- Tailwind CSS CDN for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PageFlip JS Library for 3D Book Turn Effect -->
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <!-- PDF.js for rendering PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        .container-book {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 500px;
        }
        .page {
            padding: 10px;
            background-color: #fdfaf7;
            border: 1px solid #c2b5a3;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex h-screen overflow-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col justify-between">
        <div class="p-4">
            <h1 class="text-2xl font-bold text-indigo-400 mb-6">📚 Digital Library</h1>
            <nav class="space-y-2">
                <button onclick="switchTab('my-contents')" class="w-full text-left py-2 px-4 rounded hover:bg-slate-800 transition">📝 My Contents</button>
                <button onclick="switchTab('ncert')" class="w-full text-left py-2 px-4 rounded hover:bg-slate-800 transition">🏫 NCERT Books (6-12)</button>
                <button onclick="switchTab('library')" class="w-full text-left py-2 px-4 rounded hover:bg-slate-800 transition">📖 General Library</button>
            </nav>
        </div>
        <div class="p-4 text-xs text-slate-500 border-t border-slate-800">
            Hosted free on GitHub Pages
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-6">

        <!-- 1. MY CONTENTS SECTION -->
        <section id="my-contents" class="tab-content">
            <h2 class="text-2xl font-bold mb-4">Aapke Apne Study Notes</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded shadow border hover:shadow-md transition">
                    <h3 class="font-bold text-lg mb-2">Class Notes - Chapter 1</h3>
                    <p class="text-sm text-gray-600 mb-4">Handwritten / Self-created PDF notes.</p>
                    <button onclick="openFlipbook('pdfs/my-books/chapter1.pdf')" class="bg-indigo-600 text-white px-3 py-1.5 rounded text-sm hover:bg-indigo-700">Read as Book 📖</button>
                </div>
            </div>
        </section>

        <!-- 2. NCERT BOOKS SECTION -->
        <section id="ncert" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">NCERT Books (Class 6 to 12)</h2>
            <div class="flex gap-4 mb-6">
                <select id="class-select" class="p-2 border rounded bg-white">
                    <option value="">Class Select Karein</option>
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                    <option value="11">Class 11</option>
                    <option value="12">Class 12</option>
                </select>
                <select id="subject-select" class="p-2 border rounded bg-white">
                    <option value="">Subject Select Karein</option>
                    <option value="science">Science / Biology</option>
                    <option value="math">Mathematics</option>
                    <option value="social">Social Science</option>
                </select>
            </div>
            
            <div class="bg-white p-4 rounded shadow">
                <h3 class="font-bold border-b pb-2 mb-3">Available Chapters</h3>
                <ul class="space-y-2">
                    <li class="flex justify-between items-center p-2 hover:bg-gray-50 rounded">
                        <span>Chapter 1: Introduction</span>
                        <button onclick="openFlipbook('pdfs/ncert/class11/ch1.pdf')" class="text-indigo-600 font-semibold hover:underline">Read Book 📖</button>
                    </li>
                </ul>
            </div>
        </section>

        <!-- 3. GENERAL LIBRARY SECTION -->
        <section id="library" class="tab-content hidden">
            <h2 class="text-2xl font-bold mb-4">General Reference Library</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-4 rounded shadow border">
                    <h3 class="font-bold text-lg">General Knowledge 2026</h3>
                    <p class="text-sm text-gray-500 mb-4">Competitive Exam Preparation</p>
                    <button onclick="openFlipbook('pdfs/library/gk.pdf')" class="bg-emerald-600 text-white px-3 py-1.5 rounded text-sm hover:bg-emerald-700">Read Book 📖</button>
                </div>
            </div>
        </section>

        <!-- FLIPBOOK MODAL / VIEWER CONTAINER -->
        <div id="flipbook-modal" class="fixed inset-0 bg-black/80 flex flex-col justify-center items-center hidden z-50 p-4">
            <button onclick="closeFlipbook()" class="absolute top-4 right-6 text-white text-3xl font-bold hover:text-red-400">&times; Close</button>
            <div class="container-book" id="book-container">
                <div id="book"></div>
            </div>
        </div>

    </main>

    <!-- JavaScript Logic -->
    <script>
        // Tab Switcher Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
        }

        // PDF.js worker setup
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pageFlip = null;

        // Open PDF in 3D Flipbook
        async function openFlipbook(pdfUrl) {
            document.getElementById('flipbook-modal').classList.remove('hidden');
            const bookElement = document.getElementById('book');
            bookElement.innerHTML = ''; // Clear previous pages

            try {
                const loadingTask = pdfjsLib.getDocument(pdfUrl);
                const pdf = await loadingTask.promise;

                // Render each PDF page as an image inside book element
                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    const viewport = page.getViewport({ scale: 1 });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;

                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    const img = document.createElement('img');
                    img.src = canvas.toDataURL('image/jpeg');
                    img.style.width = '100%';
                    img.style.height = '100%';
                    
                    pageDiv.appendChild(img);
                    bookElement.appendChild(pageDiv);
                }

                // Initialize StPageFlip
                pageFlip = new St.PageFlip(bookElement, {
                    width: 400,
                    height: 600,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 500,
                    minHeight: 400,
                    maxHeight: 700,
                    maxShadowOpacity: 0.5,
                    showCover: true,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

            } catch (error) {
                alert('PDF File Load Nahi Ho Paayi! Check karein ki path sahi hai ya nahi.');
                console.error(error);
                closeFlipbook();
            }
        }

        function closeFlipbook() {
            document.getElementById('flipbook-modal').classList.add('hidden');
            if(pageFlip) {
                pageFlip.destroy();
            }
        }
    </script>
</body>
</html>
